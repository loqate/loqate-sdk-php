# ==============================================================================
# Release from Tag
# ==============================================================================
# Creates the GitHub Release "Release vX.Y.Z" for a v* tag, with GitHub's
# generated notes ("What's Changed", one line per merged PR) since the previous
# tag - the same format as releases made by hand in the GitHub UI. Three ways in:
#
#   push: tags          a tag pushed by hand (as v1.1.2-v1.1.4 were).
#   workflow_call       auto-tag.yml, for the tags it creates. A tag created with
#                       GITHUB_TOKEN does not trigger `push: tags`, so auto-tag
#                       calls this workflow directly.
#   workflow_dispatch   Actions > Release from Tag > Run workflow, for a tag that
#                       already exists but has no release.
#
# An existing release is left alone, so running it twice for one tag is
# harmless. No zip is attached: Composer installs from the tag's dist tarball,
# which GitHub generates.
# ==============================================================================

name: Release from Tag

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      tag:
        description: Tag to release, e.g. v1.1.5
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, e.g. v1.1.4
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Release ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history + tags, for the notes below.

      # On a tag push `inputs` is empty, so the tag comes from the ref.
      # The previous tag is passed explicitly: left to guess, GitHub compared
      # v1.1.4 with itself when that release was made by hand.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null || { echo "::error::Tag $TAG does not exist"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists; leaving it alone."; exit 0; fi
          PREVIOUS=$(git tag -l 'v*' --sort=-v:refname | grep -A1 -xF "$TAG" | sed -n 2p)
          echo "Releasing $TAG, notes since ${PREVIOUS:-the start of history}"
          gh release create "$TAG" --verify-tag --title "Release $TAG" --generate-notes ${PREVIOUS:+--notes-start-tag "$PREVIOUS"}
